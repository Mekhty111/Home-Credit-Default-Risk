{% extends "base.html" %}
{% block title %}Overview{% endblock %}
{% block content %}

<section class="container hero">
  <div class="hero__copy">
    <div class="hero__eyebrow" data-reveal>
      <span class="badge badge--good" data-i18n="hero_badge"></span>
      <span data-i18n="hero_eyebrow"></span>
    </div>
    <h1 class="hero__title">
      <span class="line"><span data-i18n="hero_title_a" style="--d:80ms"></span></span>
      <span class="line"><span class="serif" data-i18n="hero_title_b" style="--d:200ms"></span></span>
    </h1>
    <p class="hero__lead" data-reveal style="--d:250ms" data-i18n="hero_lead"></p>
    <div class="hero__cta" data-reveal style="--d:350ms">
      <a href="/ui/score" class="btn btn--primary btn--lg">
        <span data-i18n="hero_cta_primary"></span>
        <svg class="icon arrow"><use href="#i-arrow-right"/></svg>
      </a>
      <a href="/ui/model" class="btn btn--lg" data-i18n="hero_cta_secondary"></a>
    </div>
    <div class="hero__meta" data-reveal style="--d:450ms">
      <div class="hero__meta-item">
        <span class="hero__meta-value serif" data-count="0.762" data-digits="3">0.762</span>
        <span class="hero__meta-label" data-i18n="hero_meta_auc"></span>
      </div>
      <div class="hero__meta-item">
        <span class="hero__meta-value serif" data-count="56">56</span>
        <span class="hero__meta-label" data-i18n="hero_meta_features"></span>
      </div>
      <div class="hero__meta-item">
        <span class="hero__meta-value serif" data-count="61503" id="meta-validated">61,503</span>
        <span class="hero__meta-label" data-i18n="hero_meta_validated"></span>
      </div>
    </div>
  </div>

  <div class="hero__stage" aria-hidden="true">
    <div class="hero__canvas" id="hero-canvas"></div>
    <div class="hero__fallback"></div>

    <div class="float-card float-card--a">
      <span class="icon-chip icon-chip--good"><svg class="icon"><use href="#i-check"/></svg></span>
      <div>
        <div class="float-card__label" data-i18n="fc_decision"></div>
        <div class="float-card__value" id="fc-decision" data-i18n="fc_decision_value"></div>
      </div>
    </div>
    <div class="float-card float-card--b">
      <svg class="mini-gauge" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="16" fill="none" stroke="var(--surface-3)" stroke-width="4"/>
        <circle id="fc-ring" cx="20" cy="20" r="16" fill="none" stroke="var(--band-vl)" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)" style="transition: stroke-dashoffset 1.6s var(--ease-out) .6s"/>
      </svg>
      <div>
        <div class="float-card__label" data-i18n="fc_pd"></div>
        <div class="float-card__value mono" id="fc-pd">—</div>
      </div>
    </div>
    <div class="float-card float-card--c">
      <span class="icon-chip icon-chip--accent"><svg class="icon"><use href="#i-sparkle"/></svg></span>
      <div>
        <div class="float-card__label" data-i18n="fc_scored_in"></div>
        <div class="float-card__value mono" id="fc-latency">—</div>
      </div>
    </div>
  </div>
</section>

<section class="container section">
  <div class="kpis" data-reveal>
    <div class="kpi">
      <div class="kpi__label"><span data-i18n="kpi_auc"></span><span class="tip-icon" tabindex="0" data-i18n-attr="data-tip:tip_auc"><svg class="icon"><use href="#i-info"/></svg></span></div>
      <div class="kpi__value serif" data-count="0.762" data-digits="3">0.762</div>
      <div class="kpi__bench"><span class="kpi__bench-fill" data-w="76.2"></span><span class="kpi__bench-mark" style="left:65%"></span></div>
      <div class="kpi__foot"><span data-i18n="kpi_min" data-i18n-vars='{"x":"0.65"}'></span><span class="badge badge--good" data-i18n="kpi_good"></span></div>
    </div>
    <div class="kpi">
      <div class="kpi__label"><span data-i18n="kpi_gini"></span><span class="tip-icon" tabindex="0" data-i18n-attr="data-tip:tip_gini"><svg class="icon"><use href="#i-info"/></svg></span></div>
      <div class="kpi__value serif" data-count="0.524" data-digits="3">0.524</div>
      <div class="kpi__bench"><span class="kpi__bench-fill" data-w="52.4"></span><span class="kpi__bench-mark" style="left:30%"></span></div>
      <div class="kpi__foot"><span data-i18n="kpi_min" data-i18n-vars='{"x":"0.30"}'></span><span class="badge badge--good" data-i18n="kpi_good"></span></div>
    </div>
    <div class="kpi">
      <div class="kpi__label"><span data-i18n="kpi_ks"></span><span class="tip-icon" tabindex="0" data-i18n-attr="data-tip:tip_ks"><svg class="icon"><use href="#i-info"/></svg></span></div>
      <div class="kpi__value serif" data-count="0.399" data-digits="3">0.399</div>
      <div class="kpi__bench"><span class="kpi__bench-fill" data-w="39.9"></span><span class="kpi__bench-mark" style="left:20%"></span></div>
      <div class="kpi__foot"><span data-i18n="kpi_min" data-i18n-vars='{"x":"0.20"}'></span><span class="badge badge--good" data-i18n="kpi_good"></span></div>
    </div>
    <div class="kpi">
      <div class="kpi__label"><span data-i18n="kpi_psi"></span><span class="tip-icon" tabindex="0" data-i18n-attr="data-tip:tip_psi"><svg class="icon"><use href="#i-info"/></svg></span></div>
      <div class="kpi__value serif">0.0001</div>
      <div class="kpi__bench"><span class="kpi__bench-fill" data-w="0.6" style="min-width:4px"></span><span class="kpi__bench-mark" style="left:100%;margin-left:-2px"></span></div>
      <div class="kpi__foot"><span data-i18n="kpi_max_psi" data-i18n-vars='{"x":"0.10"}'></span><span class="badge badge--good" data-i18n="kpi_stable"></span></div>
    </div>
  </div>
</section>

<section class="container section">
  <div class="grid-2">
    <div class="card" data-reveal>
      <div class="card__head">
        <div>
          <div class="card__title" data-i18n="dist_title"></div>
          <div class="card__sub" id="dist-sub"></div>
        </div>
        <div class="legend">
          <span class="legend__item"><span class="band-dot" style="background:var(--band-l)"></span><span data-i18n="legend_applicants"></span></span>
          <span class="legend__item"><span class="legend__line"></span><span data-i18n="legend_dr"></span></span>
        </div>
      </div>
      <div class="card__body">
        <div class="chart" id="dist-chart">
          <div class="skeleton" style="height:280px"></div>
        </div>
      </div>
    </div>

    <div class="card" data-reveal style="--d:80ms">
      <div class="card__head">
        <div>
          <div class="card__title" data-i18n="bands_title"></div>
          <div class="card__sub" data-i18n="bands_sub"></div>
        </div>
      </div>
      <div class="card__body">
        <div class="bands" id="bands"></div>
      </div>
    </div>
  </div>
</section>

<section class="container section">
  <div class="grid-2 grid-2--even">
    <div class="card" data-reveal>
      <div class="card__head">
        <div>
          <div class="card__title" data-i18n="session_title"></div>
          <div class="card__sub" data-i18n="session_sub"></div>
        </div>
        <a href="/ui/history" class="btn btn--ghost btn--sm"><span data-i18n="view_all"></span><svg class="icon arrow"><use href="#i-arrow-right"/></svg></a>
      </div>
      <div class="card__body">
        <div class="stat-row">
          <div class="stat"><div class="stat__label" data-i18n="st_scored"></div><div class="stat__value serif" id="st-total">0</div></div>
          <div class="stat"><div class="stat__label" data-i18n="st_approval"></div><div class="stat__value serif" id="st-approval">—</div></div>
          <div class="stat"><div class="stat__label" data-i18n="st_avg"></div><div class="stat__value serif" id="st-avg">—</div></div>
        </div>
        <div class="recent" id="recent"></div>
      </div>
    </div>

    <div class="cta-banner" data-reveal style="--d:80ms" data-tilt="4">
      <div>
        <div class="cta-banner__title"><span data-i18n="cta_title_a"></span><br><span class="serif" data-i18n="cta_title_b"></span></div>
        <p class="cta-banner__text" data-i18n="cta_text"></p>
      </div>
      <a href="/ui/score" class="btn btn--lg"><span data-i18n="cta_btn"></span><svg class="icon arrow"><use href="#i-arrow-right"/></svg></a>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/pages/overview.js?v={{ app_version }}"></script>
{% endblock %}
